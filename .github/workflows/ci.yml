name: Build and integration checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run integration tests
        run: sh mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Type-check and build
        run: pnpm build
        working-directory: frontend

  docker-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [backend/app/Dockerfile, frontend/Dockerfile]
    steps:
      - uses: actions/checkout@v7
      - name: Build the deploy image
        run: docker build -f ${{ matrix.dockerfile }} .
