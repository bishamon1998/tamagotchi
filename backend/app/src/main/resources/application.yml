server:
  port: ${PORT:8080}

spring:
  application:
    name: tamagotchi
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tamagotchi}
    username: ${DATABASE_USERNAME:tamagotchi}
    password: ${DATABASE_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
  mini-app-url: ${MINI_APP_URL:}
  init-data-max-age: ${TELEGRAM_INIT_DATA_MAX_AGE:24h}

# Comma-separated Telegram user ids allowed to use the tester tools in the Mini App; empty means nobody.
testers:
  ids: ${TESTER_IDS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
